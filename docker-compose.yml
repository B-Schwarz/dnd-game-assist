services:
  webapp:
    depends_on:
      - db
    build: .
    ports:
      - "5000:4000"
    environment:
      - NODE_ENV=production
      - DB_URI=mongodb://db:27017/dnd
      - DND_COOKIE_SECRET="asdasdasd"
      - CORS_URL="localhost:5000"
  db:
    image: mongo:8.0
    volumes:
      - ./mongo_volume:/data/db
